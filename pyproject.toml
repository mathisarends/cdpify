[project]
name = "cdpify"
version = "0.3.0"
description = "A Python client for the Chrome DevTools Protocol (CDP) optimized for DX."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
orjson = [
    "orjson>=3.11.3",
]
websocket = [
    "websockets>=15.0.1",
]
generator = [
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "ruff>=0.14.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdpify*"]
exclude = ["specs*", "tests*"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
    "websockets>=15.0.1",
]

[tool.setuptools.package-data]
"cdpify.generator" = ["templates/*.jinja2"]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]

ignore = [
    "D203",  # no blank line before class docstring
    "D212",  # multi-line docstring summary first line
    "D213",  # multi-line docstring summary second line
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
