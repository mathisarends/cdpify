name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --dev --extra orjson

      - name: Ruff check
        run: uv run --python ${{ matrix.python-version }} ruff check . --exclude cdpify/domains

      - name: Ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check . --exclude cdpify/domains

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --extra orjson pytest tests -v
